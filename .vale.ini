# taste — deterministic anti-slop lint pack (Vale config template)
#
# Copy this file to a repo root as `.vale.ini` and point StylesPath at wherever
# you vendored `styles/` (this pack ships them in styles/Taste/). Then run
# `vale <paths>` locally or in CI. See lint/README.md for wiring.
#
# This is the mechanical layer under whatever editorial review you run. It
# catches the pattern-matchable tells so the human (or model) reading passes
# spend their attention on the things a regex cannot see.

StylesPath = styles

# Show warnings + errors; suggestions are advisory and off by default so a repo
# can adopt the pack without drowning. CI fails on error-level only (see runner).
MinAlertLevel = warning

# Prose surfaces a person reads. Not code, not lockfiles, not generated docs.
[*.{md,markdown,mdx,txt}]
BasedOnStyles = Taste

# Fenced code blocks and inline code are exempt — a variable named `leverage`
# or a shell `--flag` is not slop.
BlockIgnores = (?s) *(```.*?```)
TokenIgnores = (\x60[^\x60]+\x60)
