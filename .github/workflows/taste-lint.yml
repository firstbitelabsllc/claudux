# taste anti-slop lint — GitHub Actions workflow template.
#
# Copy to a repo as .github/workflows/taste-lint.yml. Assumes the pack's
# `.vale.ini` + `styles/` are vendored at the repo root (or adjust `working` /
# StylesPath). Fails the build on error-level tells; warnings show in the log.
#
# Scope the `vale` invocation at the bottom to the prose surfaces that matter
# (docs, README, marketing copy). Do NOT point it at generated docs or vendored
# content, or you lint someone else's voice.
#
# NO `paths:` FILTER, DELIBERATELY. If you make this a required status check in
# branch protection, a paths filter means the job never runs on PRs that touch
# no markdown — and GitHub blocks those PRs forever waiting for a status that
# will never arrive. Scope the vale command, not the trigger. The job is ~5s.
name: taste anti-slop lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taste-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Vale
        env:
          VALE_VERSION: '3.15.1'
        run: |
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o /tmp/vale.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/vale.tar.gz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run taste lint
        # Fails only on error-level rules (AISlop). Warnings are reported.
        run: vale --minAlertLevel error README.md docs/
